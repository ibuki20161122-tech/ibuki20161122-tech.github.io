<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Typing Game DX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>⌨️ Typing Game DX</h1>

  <p id="jpWord">スペースでスタート</p>
  <p id="romaWord"></p>

  <input id="input" disabled>

  <div class="status">
    🏆 <span id="score">0</span>
    ⏱ <span id="time">30</span>
    🔥 <span id="combo">0</span>
  </div>

  <h2>🏆 ランキング</h2>
  <ol id="ranking"></ol>

  <button onclick="startGame()">スタート</button>

</div>

<div id="version">v1.1.0</div>

<script src="script.js"></script>
</body>
</html>
