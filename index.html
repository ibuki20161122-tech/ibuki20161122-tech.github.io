<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NEON CODE RUSH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- タイトル -->
<div id="titleScreen">
  <h1>NEON CODE RUSH</h1>
  <p>Press SPACE to Start</p>
</div>

<!-- ゲーム -->
<div id="gameScreen" class="hidden">

  <div id="hud">
    🏆 <span id="score">0</span>
    🔥 <span id="combo">0</span>
    ⏱ <span id="time">30.0</span>
  </div>

  <p id="jpWord"></p>
  <p id="romaWord"></p>

  <input id="input" type="text" disabled>

</div>

<!-- 結果 -->
<div id="result" class="hidden">
  <h2>RESULT</h2>
  <p id="finalScore"></p>
  <button onclick="location.reload()">RESTART</button>
</div>

<script src="script.js"></script>
</body>
</html>
