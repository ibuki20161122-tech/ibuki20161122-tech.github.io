<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NEON CODE RUSH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="titleScreen">
  <h1>NEON CODE RUSH</h1>
  <p>Press SPACE to Start</p>
</div>

<div id="startOverlay" class="hidden">
  <div id="countdown">3</div>
</div>

<div id="gameScreen" class="hidden">

  <div id="hud">
    🏆 <span id="score">0</span>
    🔥 <span id="combo">0</span>
    ⏱ <span id="time">30.0</span>
    📈 <span id="level">1</span>
  </div>

  <p id="jpWord"></p>
  <p id="romaWord"></p>

  <input id="input" disabled>

  <div>
    🎯 Accuracy: <span id="accuracy">100</span>%
    ⚡ WPM: <span id="wpm">0</span>
    ❌ Miss: <span id="miss">0</span>
  </div>

</div>

<div id="result" class="hidden">
  <h2>RESULT</h2>
  <p id="finalScore"></p>
  <button onclick="closeResult()">戻る</button>
</div>

<audio id="bgm" loop>
  <source src="bgm.mp3">
</audio>

<script src="script.js"></script>
</body>
</html>
