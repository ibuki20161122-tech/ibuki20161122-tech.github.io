<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NEON CODE RUSH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- タイトル -->
<div id="titleScreen">
  <h1 class="title">NEON CODE RUSH</h1>
  <p class="subtitle">Press SPACE to Start</p>
</div>

<!-- ゲーム -->
<div id="gameScreen" class="container hidden">
  <p id="jpWord"></p>
  <p id="romaWord"></p>

  <input id="input" disabled>

  <div class="status">
    🏆 <span id="score">0</span>
    ⏱ <span id="time">30</span>
    📈 <span id="level">1</span>
    🔥 <span id="combo">0</span>
  </div>

  <h2>🏆 ランキング</h2>
  <ol id="ranking"></ol>

  <button id="bgmToggle">🔊 BGM ON</button>
</div>

<!-- 結果 -->
<div id="result" class="hidden">
  <div class="resultBox">
    <h2>RESULT</h2>
    <p id="finalScore"></p>
    <button onclick="closeResult()">閉じる</button>
  </div>
</div>

<div id="version"></div>

<script src="script.js"></script>
</body>
</html>
