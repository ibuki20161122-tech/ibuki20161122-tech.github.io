<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>NEON CODE RUSH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- タイトル -->
<div id="titleScreen">
  <h1>NEON CODE RUSH</h1>
  <p>Press SPACE to Start</p>
</div>

<!-- ゲーム -->
<div id="gameScreen" class="hidden">
  <p id="jpWord"></p>
  <p id="romaWord"></p>

  <input id="input" disabled>

  <div>
    🏆 <span id="score">0</span>
    ⏱ <span id="time">30</span>
    📈 <span id="level">1</span>
    🔥 <span id="combo">0</span>
  </div>

  <div id="comboEffect"></div>

  <h3>ランキング</h3>
  <ol id="ranking"></ol>
</div>

<!-- 結果 -->
<div id="result" class="hidden">
  <h2>RESULT</h2>
  <p id="finalScore"></p>
  <button onclick="closeResult()">閉じる</button>
</div>

<script src="script.js"></script>
</body>
</html>
