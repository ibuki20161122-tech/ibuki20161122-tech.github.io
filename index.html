<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Game DX</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
  <h1>⌨️ Typing Game DX</h1>

  <div class="card">
    <p id="jpWord">スペースキーでスタート</p>
    <p id="romaWord"></p>

    <input type="text" id="input" placeholder="ローマ字で入力" disabled>

    <div class="stats">
      <div>🏆 <span id="score">0</span></div>
      <div>👑 <span id="highScore">0</span></div>
      <div>⏱ <span id="time">30</span></div>
      <div>📈 <span id="level">1</span></div>
      <div>🔥 <span id="combo">0</span></div>
    </div>

    <button onclick="startGame()">スタート</button>
    <button onclick="showRanking()">ランキング</button>
  </div>

  <p class="hint">スペースキーでも開始できます</p>
</div>

<div id="effect"></div>

<script src="script.js"></script>
</body>
</html>
